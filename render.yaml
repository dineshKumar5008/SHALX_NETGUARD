services:
  # ----------------------------------------------------------------------------
  # SHALX NETGUARD — Backend API Web Service (Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: netguard-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: netguard-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: netguard-frontend
          property: host
      - key: EMAIL_PROVIDER
        value: "resend"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: "SHALX NETGUARD SOC"
      - key: BREVO_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "SHALX NETGUARD Security"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: ADMIN_EMAIL
        sync: false

  # ----------------------------------------------------------------------------
  # SHALX NETGUARD — Frontend Static Site
  # Note: Static sites do not specify a plan or region on Render.
  # ----------------------------------------------------------------------------
  - type: web
    name: netguard-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: netguard-backend
          property: host

databases:
  # ----------------------------------------------------------------------------
  # SHALX NETGUARD — Managed PostgreSQL Database (Free Tier)
  # ----------------------------------------------------------------------------
  - name: netguard-postgres
    plan: free
    region: oregon
    databaseName: netguarddb
    user: netguard
