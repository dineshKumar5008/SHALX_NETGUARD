services:
  # ----------------------------------------------------------------------------
  # SHALX NETGUARD — Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: netguard-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: netguard-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: netguard-frontend
          property: url
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "SHALX NETGUARD Security"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"

  # ----------------------------------------------------------------------------
  # SHALX NETGUARD — Frontend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: netguard-frontend
    env: static
    region: oregon
    plan: standard
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: netguard-backend
          property: url

databases:
  # ----------------------------------------------------------------------------
  # SHALX NETGUARD — Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: netguard-postgres
    plan: standard
    region: oregon
    databaseName: netguarddb
    user: netguard
