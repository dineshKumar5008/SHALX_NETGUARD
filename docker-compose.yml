version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netguardpass2026}
      POSTGRES_DB: ${POSTGRES_DB:-netguarddb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netguard -d netguarddb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: netguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://netguard:netguardpass2026@postgres:5432/netguarddb
      - ENVIRONMENT=prod
      - SECRET_KEY=${SECRET_KEY:-netguard-super-secret-production-grade-key-2026-soc-defense}
      - SURICATA_EVE_PATH=/var/log/suricata/eve.json
    ports:
      - "8000:8000"
    volumes:
      - suricata_logs:/var/log/suricata:ro
      - reports_data:/app/reports_storage

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
    container_name: netguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  suricata_logs:
  reports_data:
