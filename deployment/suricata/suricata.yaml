%YAML 1.1
---
# SHALX NETGUARD Suricata EVE Configuration Excerpt
# Location: /etc/suricata/suricata.yaml

vars:
  address-groups:
    HOME_NET: "[192.168.10.0/24,192.168.20.0/24,192.168.30.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
  port-groups:
    HTTP_PORTS: "80,8080,8000"
    SSH_PORTS: "22"

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/suricata/eve.json
      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            packet: yes
            metadata: yes
            http-body: yes
        - http:
            extended: yes
        - dns:
            query: yes
            answer: yes
        - tls:
            extended: yes
        - flow
        - stats:
            totals: yes
            threads: no
            interval: 10sec

rule-files:
  - /etc/suricata/rules/local.rules
