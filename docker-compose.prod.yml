version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netguard-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netguard_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-netguarddb}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netguard} -d ${POSTGRES_DB:-netguarddb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: netguard-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=prod
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD:-netguard_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-netguarddb}
      - SECRET_KEY=${SECRET_KEY:-netguard-super-secret-production-grade-key-2026-soc-defense}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-SHALX NETGUARD Security}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
    volumes:
      - reports_data_prod:/app/reports_storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_WS_URL=${VITE_WS_URL:-}
    container_name: netguard-frontend-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata_prod:
  reports_data_prod:
